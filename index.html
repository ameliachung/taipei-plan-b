<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taipei Plan B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root{
    --bg:#0A0A12; --ink:#E8E8F0; --mut:#8B8698; --faint:#565064;
    --now:#FF8A3D; --after:#B266FF; --line:#22202E;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body.zh{font-family:"Noto Sans TC",Inter,system-ui,sans-serif}

  /* ---------- language toggle ---------- */
  #lang{position:fixed;right:18px;top:16px;z-index:60;background:rgba(14,14,24,.86);
    border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;
    font:600 12.5px Inter,"Noto Sans TC",sans-serif;letter-spacing:.06em;cursor:pointer;
    backdrop-filter:blur(8px);transition:border-color .2s}
  #lang:hover{border-color:var(--after)}

  .wrap{max-width:1280px;margin:0 auto;padding:0 24px}

  /* ---------- hero ---------- */
  .hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;padding:70px 0 40px}
  .kicker{font-size:11.5px;letter-spacing:.34em;color:var(--mut);text-transform:uppercase;
    display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .kicker::before{content:"";width:26px;height:1px;background:var(--now)}
  h1{font-weight:900;letter-spacing:-.025em;font-size:clamp(46px,10vw,124px);line-height:.94;margin:0}
  h1 em{font-style:normal;color:var(--after)}
  .dek{color:var(--mut);font-size:clamp(15px,1.8vw,19px);max-width:56ch;line-height:1.65;margin-top:26px}
  .scrollcue{margin-top:52px;color:var(--faint);font-size:12px;letter-spacing:.2em;
    display:flex;align-items:center;gap:10px}
  .scrollcue span{display:inline-block;width:1px;height:34px;background:linear-gradient(var(--faint),transparent)}

  /* ---------- scrolly ---------- */
  .scrolly{display:grid;grid-template-columns:1.1fr .9fr;gap:52px;align-items:start;position:relative}
  .sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center}
  .figure{position:relative;width:100%}
  #holder{line-height:0;text-align:center}
  canvas{display:block;margin:0 auto;max-width:100%}

  .phase{position:absolute;left:6px;top:6px;pointer-events:none;text-shadow:0 2px 18px #000}
  .phase .k{font-size:10px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase}
  .phase .v{font-weight:900;font-size:clamp(17px,2.3vw,24px);line-height:1.15;margin-top:3px}
  .phase .s{font-size:12px;color:var(--mut);margin-top:2px}
  .legend{position:absolute;right:6px;bottom:6px;display:flex;flex-direction:column;gap:7px;
    font-size:11.5px;pointer-events:none;text-align:right;text-shadow:0 1px 10px #000}
  .legend .row{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 12px currentColor}
  #tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
    background:rgba(10,10,18,.95);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:12.5px;line-height:1.55;min-width:168px;
    box-shadow:0 12px 34px rgba(0,0,0,.6);z-index:12}
  #tip .n{font-weight:700;font-size:13.5px;margin-bottom:6px}
  #tip .r{display:flex;justify-content:space-between;gap:16px;color:var(--mut)}
  #tip .r b{font-weight:600;font-variant-numeric:tabular-nums}
  #tip .r.a b{color:var(--now)} #tip .r.b b{color:var(--after)}

  .steps{padding:24vh 0 30vh}
  .step{min-height:88vh;display:flex;align-items:center;opacity:.24;
    transition:opacity .45s ease}
  .step.on{opacity:1}
  .step .inner{border-left:2px solid var(--line);padding-left:24px;transition:border-color .45s}
  .step.on .inner{border-left-color:var(--now)}
  .step.on.aft .inner{border-left-color:var(--after)}
  .step h2{font-size:clamp(20px,2.5vw,28px);font-weight:700;letter-spacing:-.01em;
    line-height:1.3;margin:0 0 14px}
  .step p{font-size:clamp(15px,1.7vw,17.5px);line-height:1.72;color:var(--mut);margin:0}
  .step p + p{margin-top:14px}
  .num{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;
    font-size:1.12em;letter-spacing:-.01em}
  .num.a{color:var(--now)} .num.b{color:var(--after)}

  /* ---------- finale ---------- */
  .finale{padding:10vh 0 14vh;max-width:900px;margin:0 auto}
  .track{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;margin-bottom:34px}
  .end{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);white-space:nowrap;transition:color .2s}
  .end.on.a{color:var(--now)} .end.on.b{color:var(--after)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:3px;
    background:linear-gradient(90deg,var(--now),var(--after));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:var(--bg);border:2px solid var(--ink);box-shadow:0 0 0 5px rgba(255,255,255,.07),0 4px 14px #000;cursor:grab}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--bg);
    border:2px solid var(--ink);box-shadow:0 0 0 5px rgba(255,255,255,.07);cursor:grab}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .m{border-top:1px solid var(--line);padding-top:13px}
  .m .k{font-size:11.5px;color:var(--mut);line-height:1.4}
  .m .v{font-size:clamp(26px,3.6vw,40px);font-weight:900;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;margin-top:5px;transition:color .25s}
  .m .v small{font-size:14px;font-weight:500;color:var(--mut);margin-left:3px}
  .tag{margin-top:46px;padding-top:26px;border-top:1px solid var(--line);
    font-size:clamp(19px,2.8vw,30px);font-weight:900;letter-spacing:-.015em;line-height:1.36}
  .hintline{margin-top:16px;color:var(--faint);font-size:13px}
  footer{margin-top:34px;color:var(--faint);font-size:11.5px;line-height:1.8;padding-bottom:40px}
  footer b{color:var(--mut);font-weight:500}

  @media(max-width:840px){
    .scrolly{grid-template-columns:1fr;gap:0}
    .sticky{height:52vh;top:0;background:linear-gradient(180deg,var(--bg) 78%,rgba(10,10,18,.86));
      z-index:5;padding-top:6px}
    .steps{padding:8vh 0 20vh}
    .step{min-height:74vh}
    .metrics{grid-template-columns:1fr;gap:12px}
    .track{grid-template-columns:1fr;gap:10px}
    .legend{font-size:10.5px}
  }
</style>
</head>

<button id="lang">中文</button>

<div class="wrap">
  <section class="hero">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p class="dek" id="dek"></p>
    <div class="scrollcue"><span></span><em style="font-style:normal" id="cue"></em></div>
  </section>

  <div class="scrolly">
    <div class="sticky">
      <div class="figure">
        <div id="holder"></div>
        <div class="phase">
          <div class="k" id="phaseK"></div>
          <div class="v" id="phaseV"></div>
          <div class="s" id="phaseS"></div>
        </div>
        <div class="legend">
          <div class="row"><span id="lgNow"></span><span class="dot" style="color:var(--now);background:var(--now)"></span></div>
          <div class="row"><span id="lgAft"></span><span class="dot" style="color:var(--after);background:var(--after)"></span></div>
        </div>
        <div id="tip"></div>
      </div>
    </div>
    <div class="steps" id="steps"></div>
  </div>

  <section class="finale">
    <div class="track">
      <div class="end on a" id="endA"></div>
      <input id="scrub" type="range" min="0" max="1000" value="1000">
      <div class="end b on" id="endB" style="text-align:right"></div>
    </div>
    <div class="metrics">
      <div class="m"><div class="k" id="kMed"></div><div class="v" id="mMed"></div></div>
      <div class="m"><div class="k" id="kFar"></div><div class="v" id="mFar"></div></div>
      <div class="m"><div class="k" id="kPop"></div><div class="v" id="mPop"></div></div>
    </div>
    <p class="tag" id="tagline"></p>
    <p class="hintline" id="hint"></p>
    <footer id="src"></footer>
  </section>
</div>

/* ============ projection + camera ============ */
const LAT0=(BB.minLat+BB.maxLat)/2, KX=Math.cos(LAT0*Math.PI/180);
const DW=(BB.maxLon-BB.minLon)*KX, DH=(BB.maxLat-BB.minLat);
const HOME={lon:(BB.minLon+BB.maxLon)/2, lat:(BB.minLat+BB.maxLat)/2, z:1};
let W=760,H=680,sc=1,PAD=30;
let cam={...HOME}, camT={...HOME};
let t=0, tT=0, pulse=0, hoverIdx=-1, hiSet=null, hiT=0, manual=false, active=0;
let sprite=null, lang='en';
const $=id=>document.getElementById(id);
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function fit(aw,ah){
  const cap=Math.min(ah, 720);
  let h=cap, w=h*(DW/DH);
  if(w>aw){ w=aw; h=w*(DH/DW); }
  W=Math.round(w); H=Math.round(h);
  sc=Math.min((W-2*PAD)/DW,(H-2*PAD)/DH);
}
const px=lon=>W/2+(lon-cam.lon)*KX*sc*cam.z;
const py=lat=>H/2-(lat-cam.lat)*sc*cam.z;

/* ============ sketch ============ */
function sketch(p){
  p.setup=function(){
    const box=$('holder').parentElement.getBoundingClientRect();
    fit(box.width, window.innerHeight*(window.innerWidth<840?0.46:0.86));
    p.createCanvas(W,H).parent('holder');
    p.pixelDensity(Math.min(2,window.devicePixelRatio||1));
    const S=128; sprite=p.createGraphics(S,S); sprite.pixelDensity(1);
    sprite.clear(); sprite.noStroke();
    for(let r=S/2;r>0;r--){ sprite.fill(255,255,255,255*Math.pow(1-r/(S/2),2.4)); sprite.circle(S/2,S/2,r*2); }
    render(); setStep(0,true);
  };
  p.windowResized=function(){
    const box=$('holder').parentElement.getBoundingClientRect();
    fit(box.width, window.innerHeight*(window.innerWidth<840?0.46:0.86));
    p.resizeCanvas(W,H);
  };
  p.draw=function(){
    if(!reduce) pulse+=0.016;
    t   += (tT-t)*0.075;
    hiT += ((hiSet?1:0)-hiT)*0.09;
    cam.lon += (camT.lon-cam.lon)*0.06;
    cam.lat += (camT.lat-cam.lat)*0.06;
    cam.z   += (camT.z  -cam.z  )*0.06;

    p.clear(); p.background(10,10,18);

    // village outlines
    p.noFill(); p.stroke(60,56,80,110); p.strokeWeight(0.7);
    for(const v of V){
      if(!v.poly||v.poly.length<3) continue;
      p.beginShape();
      for(const q of v.poly) p.vertex(px(q[0]),py(q[1]));
      p.endShape(p.CLOSE);
    }

    const hue=[C_NOW[0]+(C_AFT[0]-C_NOW[0])*t, C_NOW[1]+(C_AFT[1]-C_NOW[1])*t, C_NOW[2]+(C_AFT[2]-C_NOW[2])*t];
    p.blendMode(p.ADD);
    for(let i=0;i<V.length;i++){
      const v=V[i];
      const d=v.near_clinic_m*(1-t)+v.near_pharm_m*t;
      const near=Math.max(0,1-Math.min(d,2000)/2000);
      const beat=0.86+0.14*Math.sin(pulse*1.7+i*0.11);
      const inHi=hiSet&&hiSet.has(i);
      const dim=1-hiT*(inHi?0:0.82);
      const boost=inHi?1+1.05*hiT:1;
      const r=(9+30*Math.sqrt((v.female||0)/FEMMAX))*(0.55+0.75*near)*(sc*cam.z/9000)*boost;
      const a=(16+108*near*near)*beat*dim*boost*(i===hoverIdx?1.9:1);
      p.tint(hue[0],hue[1],hue[2],a);
      p.image(sprite,px(v.cx)-r,py(v.cy)-r,r*2,r*2);
    }
    const facBoost=(hiSet==='nowpts')?1.9:1;
    fac(p,NOW_PTS,C_NOW,Math.pow(1-t,0.8)*facBoost);
    fac(p,PH_PTS ,C_AFT,Math.pow(t,0.8));
    p.blendMode(p.BLEND); p.noTint();

    if(hoverIdx>=0){
      const v=V[hoverIdx];
      p.noFill(); p.stroke(232,232,240,190); p.strokeWeight(1.2);
      p.circle(px(v.cx),py(v.cy),26+3*Math.sin(pulse*3));
    }
  };
}
function fac(p,arr,col,a){
  if(a<=0.02) return;
  const gr=Math.max(7,sc*cam.z*0.0016);
  for(let i=0;i<arr.length;i++){
    const x=px(arr[i][0]), y=py(arr[i][1]);
    if(x<-30||x>W+30||y<-30||y>H+30) continue;
    p.tint(col[0],col[1],col[2],52*Math.min(a,1)); p.image(sprite,x-gr,y-gr,gr*2,gr*2);
    p.tint(255,255,255,120*Math.min(a,1));         p.image(sprite,x-1.9,y-1.9,3.8,3.8);
  }
}

/* ============ metrics ============ */
function metrics(v){
  const ds=new Array(V.length); let far=0,fp=0;
  for(let i=0;i<V.length;i++){
    const d=V[i].near_clinic_m*(1-v)+V[i].near_pharm_m*v;
    ds[i]=d; if(d>1000){far++; fp+=V[i].female||0;}
  }
  ds.sort((a,b)=>a-b);
  const n=ds.length;
  return {med:n%2?ds[(n-1)/2]:(ds[n/2-1]+ds[n/2])/2, far, pop:fp/TOTF*100};
}
function updateMetrics(){
  const v=+$('scrub').value/1000, m=metrics(v), L=COPY[lang];
  const c=`rgb(${Math.round(C_NOW[0]+(C_AFT[0]-C_NOW[0])*v)},${Math.round(C_NOW[1]+(C_AFT[1]-C_NOW[1])*v)},${Math.round(C_NOW[2]+(C_AFT[2]-C_NOW[2])*v)})`;
  $('mMed').innerHTML=Math.round(m.med)+'<small>m</small>';
  $('mFar').innerHTML=m.far+'<small>/456</small>';
  $('mPop').innerHTML=m.pop.toFixed(1)+'<small>%</small>';
  ['mMed','mFar','mPop'].forEach(id=>$(id).style.color=c);
  $('endA').classList.toggle('on',v<0.5);
  $('endB').classList.toggle('on',v>=0.5);
  $('phaseV').textContent = v<0.5?L.now:L.after;
  $('phaseV').style.color = v<0.5?'var(--now)':'var(--after)';
  $('phaseS').textContent = v<0.5?L.nowSub:L.aftSub;
}

/* ============ steps ============ */
function setStep(i,force){
  if(i===active&&!force) return;
  active=i; manual=false;
  const s=STEPS[i];
  tT=s.t; hiSet=s.hi;
  camT = s.cam ? {lon:s.cam.lon,lat:s.cam.lat,z:s.cam.z} : {...HOME};
  const L=COPY[lang];
  $('phaseV').textContent = s.t<0.5?L.now:L.after;
  $('phaseV').style.color = s.t<0.5?'var(--now)':'var(--after)';
  $('phaseS').textContent = s.t<0.5?L.nowSub:L.aftSub;
  document.querySelectorAll('.step').forEach((el,k)=>{
    el.classList.toggle('on',k===i);
    el.classList.toggle('aft',STEPS[k].t>=0.5);
  });
}

function buildSteps(){
  const L=COPY[lang];
  $('steps').innerHTML = L.steps.map((s,i)=>
    `<section class="step" data-i="${i}"><div class="inner">
       <h2>${s.h}</h2>${s.p.map(x=>`<p>${x}</p>`).join('')}
     </div></section>`).join('');
  if(window.__obs) window.__obs.disconnect();
  window.__obs = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting) setStep(+e.target.dataset.i); });
  },{rootMargin:'-45% 0px -45% 0px'});
  document.querySelectorAll('.step').forEach(el=>window.__obs.observe(el));
  document.querySelectorAll('.step').forEach((el,k)=>{
    el.classList.toggle('on',k===active);
    el.classList.toggle('aft',STEPS[k].t>=0.5);
  });
}

/* ============ language ============ */
function applyLang(){
  const L=COPY[lang];
  document.documentElement.lang = lang==='zh'?'zh-Hant':'en';
  document.body.classList.toggle('zh',lang==='zh');
  $('lang').textContent=L.lang;
  $('kicker').textContent=L.kicker;
  $('title').innerHTML=L.title[0]+'<em>'+L.title[1]+'</em>';
  $('dek').textContent=L.dek;
  $('cue').textContent=L.cue;
  $('phaseK').textContent=L.phaseK;
  $('lgNow').textContent=L.lgNow;
  $('lgAft').textContent=L.lgAft;
  $('kMed').textContent=L.kMed; $('kFar').textContent=L.kFar; $('kPop').textContent=L.kPop;
  $('endA').textContent=L.endA; $('endB').textContent=L.endB;
  $('tagline').innerHTML=L.tag;
  $('hint').textContent=L.hint;
  $('src').innerHTML=L.data+'<br>'+L.method;
  buildSteps(); updateMetrics();
}
$('lang').addEventListener('click',()=>{ lang = lang==='en'?'zh':'en'; applyLang(); });

/* ============ slider + hover ============ */
$('scrub').addEventListener('input',e=>{ manual=true; tT=+e.target.value/1000; updateMetrics(); });

const holder=$('holder'), tip=$('tip');
function onMove(ev){
  const rect=holder.getBoundingClientRect();
  const mx=ev.clientX-rect.left, my=ev.clientY-rect.top;
  let best=-1, bd=26*26;
  for(let i=0;i<V.length;i++){
    const dx=px(V[i].cx)-mx, dy=py(V[i].cy)-my, q=dx*dx+dy*dy;
    if(q<bd){ bd=q; best=i; }
  }
  hoverIdx=best;
  if(best<0){ tip.style.opacity=0; return; }
  const v=V[best], L=COPY[lang];
  tip.innerHTML=`<div class="n">${v.dist} ${v.vill}</div>
    <div class="r"><span>${L.tipW}</span><b>${v.female.toLocaleString()}</b></div>
    <div class="r a"><span>${L.tipN}</span><b>${Math.round(v.near_clinic_m)} m</b></div>
    <div class="r b"><span>${L.tipA}</span><b>${Math.round(v.near_pharm_m)} m</b></div>`;
  const fg=holder.parentElement.getBoundingClientRect();
  let lx=ev.clientX-fg.left+16, ly=ev.clientY-fg.top+14;
  if(lx>fg.width-195) lx=ev.clientX-fg.left-186;
  tip.style.left=lx+'px'; tip.style.top=ly+'px'; tip.style.opacity=1;
}
holder.addEventListener('mousemove',onMove);
holder.addEventListener('mouseleave',()=>{hoverIdx=-1; tip.style.opacity=0;});

applyLang();
new p5(sketch);
</script>
